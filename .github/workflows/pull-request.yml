name: Validation

# IAC-BL-23: push:branches:[main] added so main itself is validated after
# every squash-merge, not just the PR head commit -- a squash-merge mints a
# new commit that a pull_request-only trigger never evaluates, so a second
# PR merged right after a first one could carry an untested tree. The
# deliberately-red checkov-coverage job (IAC-BL-3) originally had to be
# split out to its own PR-only workflow (checkov-coverage.yml) for exactly
# this reason -- a push:main trigger would have turned main's badge
# permanently red, same split as infrastructure-core's old IAC-BL-20 job.
# Sprint 15 T6 (IAC-D47) retires that split: no job in this org is designed
# to be red, so checkov-coverage.yml is gone and the ledger-driven
# `checkov-ledger` job below (green iff a live scan matches
# checkov-ledger.json exactly) runs safely on both triggers -- same
# doctrine as infrastructure-core's own Sprint 15 T4b.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tofu-test:
    name: Mocked tofu test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.11.6
          # Same reasoning as infrastructure-core's pull-request.yml: the
          # default wrapper masks tofu's real exit code behind step outputs.
          tofu_wrapper: false

      - name: OpenTofu Format Check
        # -recursive: today's layout is flat (no subdirectories), but a
        # module repo conventionally grows an examples/ directory later --
        # a non-recursive check would silently stop covering it.
        run: tofu fmt -check -recursive

      - name: OpenTofu Init
        run: tofu init

      - name: OpenTofu Validate
        run: tofu validate

      # main.tftest.hcl mocks the cloudflare provider (mock_provider block)
      # -- no real Cloudflare API calls, no credentials needed. The
      # merge-time real-infrastructure test (Sprint 04 Task 5) is separate.
      #
      # `tofu test` exits 0 on "0 passed, 0 failed" just as readily as on a
      # real pass -- the identical vacuous-pass shape as the Checkov gate
      # below (confirmed by reproduction: an empty test directory, and a
      # .tftest.hcl with zero run blocks, both report success). Capturing
      # output via command substitution (not a pipe) sidesteps needing
      # `set -o pipefail`/`PIPESTATUS` to get tofu's real exit code, and
      # asserting on "N passed" means a future PR that deletes or renames
      # every run block in main.tftest.hcl can't silently turn this into a
      # no-op check.
      # -filter=main.tftest.hcl: without it, `tofu test` picks up EVERY
      # *.tftest.hcl in the repo, including realinfra.tftest.hcl (Sprint 04 Task 5)
      # -- which has no mock_provider and needs the real Cloudflare credential that
      # only exists in merge-real-infra-test.yml's job, not here. That mismatch
      # is exactly what broke PR #4's first run: this job tried to hit the live
      # API with no credentials and failed. PR validation must stay mock-only;
      # the real-infra file runs on its own workflow, on merge to main.
      - name: OpenTofu Test
        run: |
          set +e
          test_output=$(tofu test -no-color -filter=main.tftest.hcl)
          test_exit=$?
          set -e

          printf '%s\n' "$test_output"

          if [ "$test_exit" -ne 0 ]; then
            echo "::error::tofu test failed."
            exit 1
          fi

          if ! printf '%s' "$test_output" | grep -qE '[1-9][0-9]* passed'; then
            echo "::error::tofu test reported zero passed runs -- vacuous pass, not real coverage. main.tftest.hcl's run blocks may be missing or renamed."
            exit 1
          fi

  checkov-scan:
    name: Checkov (HCL) -- policy scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installed via pip rather than bridgecrewio/checkov-action, matching
      # infrastructure-core's pull-request.yml: that action's pinned image is
      # frozen at Checkov 2.0.930 (Jan 2022) regardless of the action's own
      # tag.
      - name: Install Checkov
        run: pip install checkov==3.3.8

      # This is the REAL policy gate: it fails on an actual Checkov
      # finding. Kept as its own job -- Sprint 15 T6 (IAC-D47) retired the
      # separate deliberately-red checkov-coverage.yml; the coverage
      # question (can Checkov even see this module's resources) now lives
      # in checkov-ledger.json's known_invisible list, evaluated by the
      # `checkov-ledger` job below. This job's own body is UNCHANGED and
      # still required until T7 (PR-B) folds it into the ledger-driven
      # scan, same staged sequence as infrastructure-core's T3 -> T4b.
      - name: Run Checkov IaC Scanner
        run: checkov -d . --framework terraform --compact

  # ---------------------------------------------------------------------------
  # THE LEDGER -- Sprint 15 (IAC-D47), T6, PR-A. UNENFORCED for now: staged
  # per the sprint plan's decision 11 (memory: stage, verify, then enforce),
  # this job lands here first, is falsified live on THIS PR with planted
  # mutations (see the PR body), and only then (T7, PR-B) replaces
  # `checkov-scan`'s body above and this job is deleted. Not in
  # `required_checks` (.ai/project.yml) -- a red run here is informative,
  # not blocking, until then.
  #
  # REPLACES `checkov-coverage.yml`'s deliberately-red coverage assertion
  # (IAC-BL-3): no job in this org is designed to be red (IAC-D47).
  # checkov-ledger.json at the repo root lists this module's root directory
  # as `known_invisible` (`cloudflare_dns_record` is structurally invisible
  # to Checkov -- it ships zero Cloudflare-provider policies) with a
  # tracking issue and a review date: green iff a live Checkov scan matches
  # the ledger EXACTLY, red on any drift -- a new finding, a vanished one, a
  # new or changed skip, the known-invisible directory starting to produce
  # results, a version change, or an acceptance past its review date. Same
  # ledger-driven action, same SHA pin, as infrastructure-core's
  # `security-scan` job -- see that repo's
  # `.github/actions/checkov-ledger/checkov_ledger.py` module docstring for
  # the full rationale and `sprints/15-checkov-ledger/sprint_plan.md` for
  # the planning decisions. `#284` (IAC-BL-3, the real Cloudflare-coverage
  # gap) stays open -- this changes how it is tracked, not whether it is
  # fixed.
  # ---------------------------------------------------------------------------
  checkov-ledger:
    name: Checkov (ledger)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: 603-Identity/checkov-ledger-action@da47eaa56584dda1f19bb8aa9bdff413b3a6f874 # v0.1.0

  secret-scan:
    name: Secret scan (detect-secrets)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # infrastructure-core#476 step 2. THE VERSION TRAP: `detect-secrets` on PATH
      # is not Yelp's upstream -- it is **bc-detect-secrets**, Bridgecrew's fork,
      # which REJECTS a baseline written by upstream 1.5.0 and vice versa. Pinned
      # explicitly here (not left to install transitively via checkov) so a future
      # checkov bump can't silently move this version out from under
      # .secrets.baseline -- same reasoning as infrastructure-core's gates-green.yml.
      - name: Install detect-secrets
        run: pip install bc-detect-secrets==1.5.47

      # SAME MECHANISM AS the pre-commit hook (.pre-commit-config.yaml),
      # deliberately, against the SAME baseline -- not a second, weaker copy.
      # `git ls-files -z` scopes this to tracked files only.
      #
      # THIS IS PR-TIME, NOT PUSH-TIME. A secret this catches has already reached
      # GitHub's servers and must be rotated, not just removed -- see
      # docs/threat_model.md. GitHub's own secret scanning + push protection
      # (free on this public repo) is the push-time half.
      - name: Scan tracked files against the secrets baseline
        run: git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline
