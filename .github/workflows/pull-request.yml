name: Validation

# IAC-BL-23: push:branches:[main] added so main itself is validated after
# every squash-merge, not just the PR head commit -- a squash-merge mints a
# new commit that a pull_request-only trigger never evaluates, so a second
# PR merged right after a first one could carry an untested tree. The
# deliberately-red checkov-coverage job (IAC-BL-3) originally had to be
# split out to its own PR-only workflow (checkov-coverage.yml) for exactly
# this reason -- a push:main trigger would have turned main's badge
# permanently red, same split as infrastructure-core's old IAC-BL-20 job.
# Sprint 15 T6 (IAC-D47) retires that split: no job in this org is designed
# to be red, so checkov-coverage.yml is gone. T7 goes further and folds the
# ledger-driven scan into `checkov-scan` below itself (green iff a live scan
# matches checkov-ledger.json exactly), which runs safely on both triggers --
# same doctrine as infrastructure-core's own Sprint 15 T4b.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tofu-test:
    name: Mocked tofu test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.13.0
          # Same reasoning as infrastructure-core's pull-request.yml: the
          # default wrapper masks tofu's real exit code behind step outputs.
          tofu_wrapper: false

      - name: OpenTofu Format Check
        # -recursive: today's layout is flat (no subdirectories), but a
        # module repo conventionally grows an examples/ directory later --
        # a non-recursive check would silently stop covering it.
        run: tofu fmt -check -recursive

      - name: OpenTofu Init
        run: tofu init

      - name: OpenTofu Validate
        run: tofu validate

      # main.tftest.hcl mocks the cloudflare provider (mock_provider block)
      # -- no real Cloudflare API calls, no credentials needed. The
      # merge-time real-infrastructure test (Sprint 04 Task 5) is separate.
      #
      # `tofu test` exits 0 on "0 passed, 0 failed" just as readily as on a
      # real pass (confirmed by reproduction: an empty test directory, and a
      # .tftest.hcl with zero run blocks, both report success) -- the same
      # vacuous-pass shape `checkov -d . --framework terraform --compact`
      # used to have below, before Sprint 15 T7 replaced it with a
      # ledger-compared scan that fails on drift instead. Capturing
      # output via command substitution (not a pipe) sidesteps needing
      # `set -o pipefail`/`PIPESTATUS` to get tofu's real exit code, and
      # asserting on "N passed" means a future PR that deletes or renames
      # every run block in main.tftest.hcl can't silently turn this into a
      # no-op check.
      # -filter=main.tftest.hcl: without it, `tofu test` picks up EVERY
      # *.tftest.hcl in the repo, including realinfra.tftest.hcl (Sprint 04 Task 5)
      # -- which has no mock_provider and needs the real Cloudflare credential that
      # only exists in merge-real-infra-test.yml's job, not here. That mismatch
      # is exactly what broke PR #4's first run: this job tried to hit the live
      # API with no credentials and failed. PR validation must stay mock-only;
      # the real-infra file runs on its own workflow, on merge to main.
      - name: OpenTofu Test
        run: |
          set +e
          test_output=$(tofu test -no-color -filter=main.tftest.hcl)
          test_exit=$?
          set -e

          printf '%s\n' "$test_output"

          if [ "$test_exit" -ne 0 ]; then
            echo "::error::tofu test failed."
            exit 1
          fi

          if ! printf '%s' "$test_output" | grep -qE '[1-9][0-9]* passed'; then
            echo "::error::tofu test reported zero passed runs -- vacuous pass, not real coverage. main.tftest.hcl's run blocks may be missing or renamed."
            exit 1
          fi

  checkov-scan:
    name: Checkov (HCL) -- policy scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Ledger-driven since Sprint 15 T7 (IAC-D47) -- the SHA-pinned
      # `603-Identity/checkov-ledger-action` (built as
      # `.github/actions/checkov-ledger` in infrastructure-core's Phase 1,
      # extracted verbatim to that public repo in infrastructure-core's T5;
      # see that module's `checkov_ledger.py` docstring for the full
      # rationale) runs `checkov -d . --framework terraform` itself and
      # evaluates the result against checkov-ledger.json at the repo root:
      # green iff a live scan matches the ledger EXACTLY, red on any drift --
      # a new finding, a vanished one, a new or changed skip, the
      # known-invisible directory starting to produce results, a version
      # change, or an acceptance past its review date. No separate
      # `pip install checkov` step here any more -- the action reads
      # `checkov_version` out of checkov-ledger.json and installs that.
      #
      # UNTIL T7 (2026-09-16), this step ran a plain
      # `checkov -d . --framework terraform --compact` with no ledger, while
      # a SEPARATE, unenforced `checkov-ledger` job (T6, PR-A) ran this same
      # ledger-driven scan for comparison -- staged per the sprint plan's
      # decision 11 (memory: stage, verify, then enforce), falsified live on
      # PR #29 with planted mutations. T7 folds the two into this one step
      # and deletes that job -- same staged sequence as infrastructure-core's
      # T3 -> T4b.
      #
      # `cloudflare_dns_record` remains structurally invisible to Checkov --
      # it ships zero Cloudflare-provider policies -- so this module's root
      # directory stays in checkov-ledger.json's `known_invisible` list
      # (`#284`, infrastructure-core, still OPEN). `tofu test` (the
      # `tofu-test` job above) and the `architect-review` fresh-session gate
      # are this repo's compensating controls for that gap -- see
      # docs/threat_model.md.
      - uses: 603-Identity/checkov-ledger-action@e868dfe172ff9f28260ceb4dddf0f39001b2bbcd # v0.1.2

  # ---------------------------------------------------------------------------
  # THE SEPARATE `checkov-ledger` JOB IS DELETED (Sprint 15 T7, 2026-09-16),
  # not merely disabled -- see `checkov-scan`'s own step comment above for why
  # it existed (T6, PR #29's staged falsification) and what replaced it.
  # ---------------------------------------------------------------------------
