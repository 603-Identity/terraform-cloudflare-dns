name: DEBUG - interim credential OIDC fetch (temporary, will be reverted)

on:
  workflow_dispatch:

# id-token: write is required for the Infisical OIDC handshake below.
permissions:
  contents: read
  id-token: write

jobs:
  debug-oidc-fetch:
    name: Verify terraform-cloudflare-dns-realinfra-ci resolves /cicd-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Fetch Secrets from Infisical
        uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          env-slug: "dev"
          project-slug: "terraform-cloudflare-dns"
          method: "oidc"
          identity-id: "bad721bb-65bd-4289-b1c5-828c245e8577"
          secret-path: "/cicd-test/"
          recursive: true

      - name: Confirm secrets resolved (values never printed)
        run: |
          missing=""
          for var in CLOUDFLARE_API_TOKEN CLOUDFLARE_ZONE_ID; do
            if [ -z "${!var:-}" ]; then
              missing="$missing $var"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing or empty:$missing"
            exit 1
          fi
          echo "Both CLOUDFLARE_API_TOKEN and CLOUDFLARE_ZONE_ID resolved with non-empty values."
