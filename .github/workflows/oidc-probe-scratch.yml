name: Scratch OIDC subject probe (Sprint 08 Task 8, temporary)

# Decodes the live GitHub OIDC token's sub/aud claims for an AWS-audience
# request, on the same trigger (push to main) that merge-real-infra-test.yml
# uses -- so the captured subject matches exactly what a real AWS trust
# policy for this workflow would need to accept. No environment: declared
# (would change the suffix). Removed once the subject is recorded verbatim
# in the Task 8 PR body -- this file is not meant to stay on main.
on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    name: Decode OIDC claims (sts.amazonaws.com audience)
    runs-on: ubuntu-latest
    steps:
      - name: Request and decode OIDC token
        run: |
          token=$(curl -sSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          payload=$(echo "$token" | cut -d '.' -f2)
          # base64url -> base64, then pad to a multiple of 4 before decoding.
          padded=$(echo "$payload" | tr '_-' '/+')
          case $(( ${#padded} % 4 )) in
            2) padded="${padded}==";;
            3) padded="${padded}=";;
          esac
          echo "$padded" | base64 -d | jq '{sub, aud}'
