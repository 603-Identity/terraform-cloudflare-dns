version: 2
updates:
  # cloudflare provider is deliberately pinned to exactly 5.22.0 (IAC-D12) --
  # Dependabot opening a PR when a newer version ships is still useful, it
  # just always needs a deliberate human decision to bump the pin, not an
  # auto-merge.
  - package-ecosystem: "terraform"
    directory: "/"
    schedule:
      interval: "weekly"

  # Also bumps the SHA-pinned 603-Identity/devcontainers reusable-workflow calls in
  # secret-scan.yml, devcontainer-image.yml and architect-review-gate.yml, as reviewed PRs.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # The devcontainer image pin (.devcontainer/Dockerfile FROM, tag + digest). A human reviews
  # and merges every bump: auto-merge is off for this repo (no devc-automerge-on tag).
  - package-ecosystem: "docker"
    directory: "/.devcontainer"
    schedule:
      interval: "weekly"
