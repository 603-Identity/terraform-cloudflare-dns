default_install_hook_types: [pre-commit]
repos:
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.108.1
    hooks:
      - id: terraform_fmt
        args:
          - --hook-config=--tf-path=tofu
      - id: terraform_validate
        args:
          - --hook-config=--tf-path=tofu
      - id: terraform_tflint
        args:
          - --hook-config=--tf-path=tofu

  # Org secret scanning (#47, devcontainers#190): Betterleaks on the staged changes, with the
  # org rules the shared image ships. Catches a secret BEFORE the commit exists.
  #
  # THIS LAYER IS BYPASSABLE and that is why it is not the only one: `--no-verify`
  # skips it, and it does not exist at all for a push from another machine or an
  # agent session. CI's required `secrets / scan` check is what actually blocks a merge.
  #
  # Copied from the devcontainers README. Absolute paths because ~/.local/bin leads PATH.
  # The `env ... safe.directory` prefix is needed on Docker Desktop, where the bind-mounted
  # workspace is not owned by `app`: without it the scan ends `incomplete` and every commit
  # fails. `--ignore-file .betterleaksignore` fails if that file is missing, so it is committed.
  - repo: local
    hooks:
      - id: betterleaks
        name: betterleaks (staged changes)
        language: system
        entry: /usr/bin/env GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.directory GIT_CONFIG_VALUE_0=/workspace /usr/local/bin/betterleaks git . --staged -c /usr/local/share/devc/secret-scan/org.toml --ignore-file .betterleaksignore --no-allow-signatures --redact --no-banner
        pass_filenames: false
        always_run: true
