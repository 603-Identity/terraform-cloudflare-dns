# way-of-working plugin contract for this repo.
# See: reference/project-schema.md in the way-of-working plugin for the full key reference.
#
# Every value below was read from this repo as it actually is on 2026-07-30 -- the check
# names come from .github/workflows/pull-request.yml's job `name:` fields, the gate commands
# from that workflow's run steps, and the ruleset block from a live API call. Nothing here
# was copied from a sibling repo's file.
#
# way-of-working v0.13.0 (WB-D17): every schema key must be present, and `roadmap`,
# `sprints_dir` and `decisions.log` may no longer be null. Until then this repo pointed all
# three at 603-Identity/infrastructure-core with nulls, because the schema's paths are
# repo-relative and cannot express "in a sibling repo". It now keeps a small record of its
# own in docs/roadmap.md -- module status, next action, and the IAC-D decisions that bind
# this repo -- which points into infrastructure-core's roadmap rather than duplicating it.
# Sprint work is planned as GitHub milestones on this repo's own issue tracker (see
# `planning` and `backlog` below).

# ── identity ─────────────────────────────────────────────────────────────────
repo: 603-Identity/terraform-cloudflare-dns
pr_base: main
migration_base: null   # no long-lived integration branch; work lands on main directly.

# ── the deep record ──────────────────────────────────────────────────────────
roadmap: docs/roadmap.md   # this module's status + next action; the org-wide migration
                           # roadmap remains infrastructure-core's docs/iac_migration_roadmap.md.
sprints_dir: sprints       # exists (sprints/README.md) so the path resolves, but holds no plans:
                           # planning.kind is github_milestones, so sprints are milestones on this
                           # repo. Required non-null by v0.13.0.
threat_model: docs/threat_model.md   # untrusted inputs, sinks, credential holders,
                           # boundaries meant to hold. Added infrastructure-core#476 step 1 --
                           # a dedicated file, not a README section, so security-critic never
                           # has to extract a scannable list from usage prose first, same
                           # reasoning terraform-microsoft365-entra's and infrastructure-core's
                           # own docs/threat_model.md were split out for. README.md points into
                           # it rather than duplicating it.

planning:
  kind: github_milestones   # one sprint = one milestone on this repo; its issues are the
                            # task list. Requires backlog.kind: github_issues (below).

decisions:
  log: docs/roadmap.md  # this repo's own CFDNS-D decisions, plus a cited list of the
                        # org-wide IAC-D decisions (logged in infrastructure-core) that bind it.
  prefix: CFDNS-D    # CFDNS-D1, applying IAC-D48: decisions affecting this repo alone are
                     # CFDNS-D, logged in docs/roadmap.md. Decisions shared with another
                     # repo, or org-wide, stay IAC-D in infrastructure-core's log, so each
                     # series has one numbering authority and can never collide.

backlog:
  kind: github_issues  # infrastructure-core switched to GitHub issues at its Sprint 10
                       # (IAC-BL-114, 2026-09-04), which retired the old reason for
                       # `kind: file` + `path: null` here (a hub file unreachable from this
                       # repo). Same shape as terraform-microsoft365-entra's.
  repo: null           # this repo's own tracker. Milestones live in {backlog.repo}, so the
                       # hub (603-Identity/infrastructure-core) would put this repo's sprints
                       # in infrastructure-core's milestone list; kept local instead.
                       # Historical IAC-BL-N citations still resolve in the hub.
  path: null
  item_prefix: null

# README.md carries the module's usage contract (the `source = git::...?ref=` example
# consumers copy). docs/threat_model.md is the dedicated threat-model doc README.md points
# into rather than duplicating (see `threat_model` above). Both are load-bearing.
load_bearing_docs:
  - README.md
  - docs/threat_model.md
  - docs/roadmap.md

# ── what counts as a behavior change ─────────────────────────────────────────
# The .tftest.hcl files are included deliberately: they are this module's only coverage, so
# a diff that edits or deletes a run block changes what is asserted about behavior even
# when no .tf line moves. The PR gate's "N passed" assertion exists for that same reason.
code_paths:
  - "*.tf"
  - "*.tftest.hcl"
  - .github/workflows/
  # Until this entry existed, an edit to this file itself -- the source of truth for what
  # code_paths, the local gate, the ruleset, and the review gate all are -- matched nothing
  # here, so a change silently weakening any of them would have routed to no reviewer at
  # all. Same reasoning infrastructure-core applies to its own .ai/project.yml entry.
  - .ai/project.yml
  # infrastructure-core#476 step 2: until this entry existed, .pre-commit-config.yaml and
  # .secrets.baseline matched nothing in code_paths, so an edit weakening either would have
  # routed to no reviewer at all. .pre-commit-config.yaml carries the commit-time half of the
  # secret gate; .secrets.baseline is the sharper of the two -- it is an ALLOWLIST OF THINGS
  # NOT TO ALERT ON, the one file in this repo where a real secret could be parked and the
  # gate would stay green by design. Same reasoning as infrastructure-core's own
  # code_paths entry for the identical pair (IAC-BL-101).
  - .pre-commit-config.yaml
  - .secrets.baseline
  # Sprint 15 T6 (IAC-D47): checkov-ledger.json is this repo's own .secrets.baseline
  # shape for Checkov -- an allowlist of accepted findings, sanctioned skips and
  # known-invisible directories that must be human-reviewed, never auto-generated.
  # infrastructure-core routed its own checkov-ledger.json here in Sprint 15 T1 after
  # finding the identical gap (a bad edit -- a padded row, a widened pin, a deleted
  # known_invisible entry -- would otherwise stay green by design with no critic ever
  # routed to it); added here in the same commit that introduces the file, not after.
  - checkov-ledger.json
  # A provider-version bump changes real runtime behavior and deserves the same review as a
  # *.tf change. architect-review-gate.yml already matched it; listing it here too closes
  # that gap (infrastructure-core#458) so `review.ci_gate.triggers_on: null` -- "same as
  # code_paths" -- is exactly true.
  - .terraform.lock.hcl

# ── the local green gate ─────────────────────────────────────────────────────
# A local pre-check, not the gate of record -- CI on the PR is. Mirrors pull-request.yml's
# tofu-test job.
#
# `-backend=false` where CI runs a plain `tofu init`: there is no backend block in
# versions.tf, so the two are equivalent here, and -backend=false additionally keeps a
# local run from inheriting a stale backend record left by a previous init.
#
# `-filter=main.tftest.hcl` is NOT optional. Without it `tofu test` picks up
# realinfra.tftest.hcl too, which has no mock_provider and needs the real Cloudflare
# credential that exists only in merge-real-infra-test.yml's job. An unfiltered local run
# fails reaching for a credential the developer does not have -- the same mismatch that
# broke PR #4's first CI run.
#
# `cwd: .` is stated rather than left implicit: the schema's rule is that an absent key is an
# unanswered question, not a default. The module is flat at the repo root, so "." is the
# answer -- but it is an answer, not an omission.
gates:
  green:
    - { cwd: ".", run: tofu fmt -check -recursive }
    - { cwd: ".", run: "tofu init -backend=false && tofu validate" }
    - { cwd: ".", run: "tofu test -filter=main.tftest.hcl" }
    # infrastructure-core#476 step 2: the secret-scanning gate. Mirrors
    # pull-request.yml's secret-scan job and .pre-commit-config.yaml's local hook --
    # same binary, same baseline, on purpose, not a third weaker copy. Requires
    # bc-detect-secrets==1.5.47 on PATH (the Bridgecrew fork, NOT Yelp's upstream --
    # the two reject each other's baseline files). `git ls-files -z` scopes this to
    # tracked files only.
    - { cwd: ".", run: "git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline" }

# ── branch protection ────────────────────────────────────────────────────────
# LIVE as of 2026-09-10 (infrastructure-core#456, infrastructure-core#476 step 4):
# `main-required-checks` (ruleset id 22782796), `enforcement: active`, `bypass_actors: []`
# -- verified live via `GET /repos/603-Identity/terraform-cloudflare-dns/rules/branches/main`,
# same read-back discipline as terraform-microsoft365-entra's own ruleset. Same shape as that
# repo's: a `pull_request` rule plus a `required_status_checks` rule naming the contexts
# below verbatim, read from each workflow's own `name:` field, not typed from memory
# (IAC-D14's absent-check trap).
#
# GitHub Free + private repo returned 403 on the rulesets API ("Upgrade to GitHub Pro or
# make this repository public") -- true as of 2026-07-30, the same response
# infrastructure-core records under IAC-D3. The org has been Team since 2026-08-07, which is
# what made the above possible.
#
# merge-real-infra-test.yml is deliberately absent -- it triggers on push to main, not on
# pull_request, so it is not a PR check and listing it would report a gate that never runs
# on the diff under review.
#
# "architect-review" (architect-review-gate.yml, infrastructure-core#476 step 3) went in
# only after being live-verified on a real PR (#25's red-with-no-review half, #27's full
# red -> green -> red cycle) -- same staged rollout terraform-microsoft365-entra used.
#
# "Checkov (HCL) -- coverage assertion (deliberately red, IAC-BL-3)" (checkov-coverage.yml's
# own job name) is GONE, not merely excluded: Sprint 15 T6 (IAC-D47) deleted
# checkov-coverage.yml outright -- no job in this org is designed to be red. The coverage
# question it used to assert (can Checkov even see this module's resources) now lives in
# checkov-ledger.json's known_invisible list, folded into the required "Checkov (HCL) --
# policy scan" job itself as of T7 (PR-B) -- there is no longer a separate ledger job to
# list here either (the unenforced `checkov-ledger` job T6 added for staging was deleted in
# the same PR). `#284` (the real Cloudflare-coverage gap) stays open -- this changes how it
# is tracked, not whether it is fixed.
ruleset:
  name: main-required-checks
  rule_types: [pull_request, required_status_checks]
  required_checks:
    - "Mocked tofu test"
    - "Checkov (HCL) -- policy scan"
    - "Secret scan (detect-secrets)"
    - "architect-review"

# ── the fresh-session review gate ────────────────────────────────────────────
# architect-review-gate.yml copied from terraform-microsoft365-entra's (the most recent
# copy of the pattern), infrastructure-core#476 step 3. Live-verified on real PRs (see
# `ruleset` above) and now a required check.
review:
  ci_gate:
    check: architect-review
    header: "**Opus/Architect HITL review (automated)**"
    attestation: "*Fresh-session review: this session did not author the diff.*"
    triggers_on: null   # the gate fires on code_paths. architect-review-gate.yml mirrors
                        # that list in its `case` block by hand -- keep the two in sync.

# ── agents ───────────────────────────────────────────────────────────────────
agents:
  enabled: [architect, coder, security-critic, docs-consistency]
models:
  architect: opus
  coder: sonnet
  second_opinion: fable   # offered as an optional late critic-gate round on a different
                          # model; runs only when the human authorizes it in-session.
